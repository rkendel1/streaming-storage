[package]
name = "artifact"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tar = "0.4.40"
zip = { version = "2.4.2", default-features = false }
wasm-bindgen = { version = "0.2.95", optional = true }

[dev-dependencies]
tempfile = "3.27.0"

[features]
wasm = ["wasm-bindgen"]

[lib]
crate-type = ["cdylib", "rlib"]
